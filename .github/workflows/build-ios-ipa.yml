name: Build OpenMinis clone iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout official source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install native build tools
        run: |
          brew install meson ninja llvm lld libarchive pkg-config
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Set up Go for official Rclone build
        uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Prepare provider customization
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Patch iSH VDSO linker path for macOS
        run: |
          lld_prefix="$(brew --prefix lld)"
          test -x "$lld_prefix/bin/ld.lld"
          sed -i '' "s#'-fuse-ld=lld'#'-fuse-ld=$lld_prefix/bin/ld.lld'#" \
            deps/ish/vdso/arm64/meson.build
          grep -F -- "-fuse-ld=$lld_prefix/bin/ld.lld" \
            deps/ish/vdso/arm64/meson.build

      - name: Verify Apple Silicon iSH native helper inputs
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -f deps/ish/asbestos/guest-arm64/gadgets-aarch64/entry.S
          echo "Native helper target: $(uname -m); ARM64 guest entry.S is present"

      - name: Compute FFmpeg cache fingerprints
        id: ffmpeg-cache-keys
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
          FFMPEG_INPUTS_HASH: ${{ hashFiles('deps/build_ffmpeg.sh', 'deps/build_lame.sh', 'deps/ffmpeg-patch/**', 'deps/lame-3.100/**') }}
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version | awk '/^Xcode / { x=$2 } /^Build version / { b=$3 } END { print x "-" b }')"
          device_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          printf 'device=ffmpeg-6.1.2-%s-%s-iphoneos-xcode-%s-sdk-%s-inputs-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$xcode_version" "$device_sdk" "$FFMPEG_INPUTS_HASH" >> "$GITHUB_OUTPUT"
          printf 'simulator=ffmpeg-6.1.2-%s-%s-iphonesimulator-xcode-%s-sdk-%s-inputs-%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$xcode_version" "$simulator_sdk" "$FFMPEG_INPUTS_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore FFmpeg Simulator build cache
        id: ffmpeg-simulator-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/.cache/ffmpeg/6.1.2/iphonesimulator-arm64
          key: ${{ steps.ffmpeg-cache-keys.outputs.simulator }}

      - name: Build Simulator LAME, FFmpeg, and iSH dependencies
        env:
          OPENMINIS_FFMPEG_BUILD_CACHE_KEY: ${{ steps.ffmpeg-cache-keys.outputs.simulator }}
        run: |
          ./deps/build_lame.sh simulator
          ./deps/build_ffmpeg.sh simulator
          ./deps/build_ish.sh release simulator

      - name: Save FFmpeg Simulator build cache
        if: success() && steps.ffmpeg-simulator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/.cache/ffmpeg/6.1.2/iphonesimulator-arm64
          key: ${{ steps.ffmpeg-cache-keys.outputs.simulator }}

      - name: Build shared dual-platform dependencies and app resources
        run: |
          ./deps/build_rclone_ios.sh
          ./deps/prepare_alpine_rootfs.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis

      - name: Run Browser navigation XCTest suite on simulator
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [d for runtime in devices.values() for d in runtime
                     if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]
          if not iphones:
              raise SystemExit("No available iPhone simulator was found")
          print(iphones[0]["udid"])
          ')"
          mkdir -p build
          # The concrete Simulator destination supplies its architecture; xcodebuild rejects a separate -arch here.
          xcodebuild test \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:MinisTests/BrowserNavigateTimeoutTests \
            -parallel-testing-enabled NO \
            -resultBundlePath build/BrowserNavigateTimeoutTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
          xcrun xcresulttool get test-results summary \
            --path build/BrowserNavigateTimeoutTests.xcresult \
            > build/BrowserNavigateTimeoutTests-summary.json
          cat build/BrowserNavigateTimeoutTests-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("build/BrowserNavigateTimeoutTests-summary.json").read_text())
          expected = 15
          counts = {
              "total": summary.get("totalTestCount"),
              "passed": summary.get("passedTests"),
              "failed": summary.get("failedTests"),
              "skipped": summary.get("skippedTests"),
          }
          print("XCTest execution counts:", counts)
          if counts != {"total": expected, "passed": expected, "failed": 0, "skipped": 0}:
              raise SystemExit(f"Expected {expected} executed and passed tests with no skips; got {counts}")
          PY

      - name: Upload Browser navigation XCTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrowserNavigateTimeoutTests-${{ github.run_number }}
          path: build/BrowserNavigateTimeoutTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Restore FFmpeg device build cache
        id: ffmpeg-device-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/.cache/ffmpeg/6.1.2/iphoneos-arm64
          key: ${{ steps.ffmpeg-cache-keys.outputs.device }}

      - name: Rebuild device native dependencies for IPA archive
        env:
          OPENMINIS_FFMPEG_BUILD_CACHE_KEY: ${{ steps.ffmpeg-cache-keys.outputs.device }}
        run: |
          ./deps/build_lame.sh device
          ./deps/build_ffmpeg.sh device
          ./deps/build_ish.sh release device

      - name: Save FFmpeg device build cache
        if: success() && steps.ffmpeg-device-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/.cache/ffmpeg/6.1.2/iphoneos-arm64
          key: ${{ steps.ffmpeg-cache-keys.outputs.device }}

      - name: Check standalone sources statically
        run: |
          set -euo pipefail
          # 静态检查先跑：括号配平、重复声明、未声明标识符、每条
          # X.contains("...") 的字符串是否真的出现在它引用的源文件里。
          # 这些错在 swift 运行时才炸，而且炸在断言脚本自己身上，看不出
          # 是断言写错还是代码写错。先在这里拦掉，省一次完整的排队。
          python3 scripts/theme/check-standalone.py

      - name: Run standalone source assertions
        run: |
          set -euo pipefail
          cd src/ios/MinisTests/Standalone
          # Every file here is written to run on its own (`swift <file>.swift`)
          # and exits non-zero on failure. Only the suites whose assertions the
          # current branch actually touched and re-verified are wired in. The
          # rest exist but have never been executed by CI, so enabling them
          # blind would just trade a silent gap for a red build nobody can
          # attribute. Add them one at a time.
          /usr/bin/swift AppearanceThemePackTests.swift
          # [T-47] 调色板完整性：内置表是字典，漏配一个角色只在运行时变 808080
          # 灰、编译不报。这条套件按角色枚举逐条核对两本书，缺一个就红。
          /usr/bin/swift AppearancePaletteIntegrityTests.swift
          # [T-skill-description-stuck-forever] The description staleness
          # predicate is what decides whether <available_skills> injects a
          # rotted sentence, so it ships with its own executable assertions
          # rather than an unrun file.
          /usr/bin/swift SkillDescriptionStaleTests.swift

      - name: Archive OpenMinis clone app unsigned
        run: |
          mkdir -p build
          xcodebuild archive \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/OpenMinis.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="build/OpenMinis.xcarchive/Products/Applications/Minis.app"
          test -d "$app"
          mkdir -p build/Payload
          cp -R "$app" build/Payload/OpenMinis.app
          # A valid IPA must have Payload/OpenMinis.app at the archive root.
          # Zipping from inside Payload produced a root-level OpenMinis.app,
          # which sideloaders reject.
          cd build
          # The IPA filename itself must carry the build number: the artifact
          # container name is already numbered, but a constant inner filename
          # silently overwrites the previous build when extracted to the same
          # folder, so two builds can no longer be told apart on disk.
          ipa="OpenMinis-clone-unsigned-${GITHUB_RUN_NUMBER}.ipa"
          /usr/bin/zip -qry "$ipa" Payload
          cd ..
          /usr/bin/file "build/$ipa"
          /usr/bin/du -h "build/$ipa"

      - name: Upload OpenMinis clone IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-clone-iOS-unsigned-${{ github.run_number }}
          path: build/OpenMinis-clone-unsigned-${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload OpenMinis clone dSYM
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-clone-iOS-dSYM-${{ github.run_number }}
          path: build/OpenMinis.xcarchive/dSYMs/
          if-no-files-found: error
          retention-days: 14
