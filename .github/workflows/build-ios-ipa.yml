name: Build official OpenMinis iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout official source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install native build tools
        run: |
          brew install meson ninja llvm libarchive pkg-config
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Prepare provider customization
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Patch iSH VDSO linker path for macOS
        run: |
          llvm_prefix="$(brew --prefix llvm)"
          test -x "$llvm_prefix/bin/ld.lld"
          sed -i '' "s#'-fuse-ld=lld'#'-fuse-ld=$llvm_prefix/bin/ld.lld'#" \
            deps/ish/vdso/arm64/meson.build
          grep -F -- "-fuse-ld=$llvm_prefix/bin/ld.lld" \
            deps/ish/vdso/arm64/meson.build

      - name: Build iOS native dependencies
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh release
          ./deps/prepare_alpine_rootfs.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis

      - name: Archive official OpenMinis app unsigned
        run: |
          mkdir -p build
          xcodebuild archive \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/OpenMinis.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="build/OpenMinis.xcarchive/Products/Applications/Minis.app"
          test -d "$app"
          mkdir -p build/Payload
          cp -R "$app" build/Payload/OpenMinis.app
          cd build/Payload
          /usr/bin/zip -qry ../OpenMinis-unsigned.ipa OpenMinis.app
          cd ../..
          /usr/bin/file build/OpenMinis-unsigned.ipa
          /usr/bin/du -h build/OpenMinis-unsigned.ipa

      - name: Upload official OpenMinis IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-iOS-unsigned-${{ github.run_number }}
          path: build/OpenMinis-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
